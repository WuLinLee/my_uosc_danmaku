# 样式/过滤的代码默认值集中在 modules/options.lua 的 DANMAKU_STYLE_DEFAULTS。
# 这里不重复声明这些默认值；如需手动覆盖，可添加同名键。
# 启动时已有的 uosc_danmaku_style.json 会覆盖同名样式项；清除 JSON 后回到这里/代码的基础值。
api_server=https://danmaku-api.152468.xyz
auto_load=no
autoload_for_url=yes
autoload_local_danmaku=no
save_danmaku=no
chConvert=0
fixtime=5
render_mode=ass
style_path=~~/script-opts/uosc_danmaku_style.json
vf_fps=yes
blacklist_menu_path=~~/script-opts/uosc_danmaku_blacklist.txt
history_path=~~/_cache/danmaku-history.json
